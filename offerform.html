<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form - Power Of Thor</title>
    <style>
        :root { 
            --gold: #b8860b; 
            --gold-light: #d4af37; 
            --bg-color: #f4f6f9; 
            --card-bg: #ffffff; 
            --text-main: #222222;
            --border-color: #e0e0e0;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        .order-container { max-width: 400px; margin: 30px auto; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .form-header { background: linear-gradient(135deg, #ffffff, #fcfaf2); border-bottom: 2px solid var(--gold-light); padding: 22px; text-align: center; }
        .form-header h2 { margin: 0; font-size: 22px; color: var(--gold); text-transform: uppercase; font-weight: 800; }
        form { padding: 25px; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 8px; font-weight: 600; }
        input, textarea { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); background: #fdfdfd; color: #000; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(45deg, var(--gold-light), var(--gold)); color: #ffffff; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        #success-msg { display: none; padding: 60px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header" id="headerSection">
        <h2>Place Your Order</h2>
        <p style="margin: 5px 0 0; font-size: 13px; color: #555;">Cash on Delivery Available ⚡</p>
    </div>

    <form id="leadForm">
        <div class="field-group">
            <label>Full Name / पूरा नाम</label>
            <input type="text" id="fio" placeholder="Enter your full name" required>
        </div>

        <div class="field-group">
            <label>Phone Number / फ़ोन नंबर</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="field-group">
            <label>Full Address / पूरा पता</label>
            <textarea id="address" rows="3" placeholder="House No, Street, City, State, Pincode" required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Confirm Order Now</button>
    </form>

    <div id="success-msg">
        <div style="font-size: 60px; color: #27ae60;">✅</div>
        <h2 style="color: var(--gold); margin-top: 15px; font-weight: 800;">ORDER SUCCESS!</h2>
        <p style="color: #555; font-size: 15px;">Your order has been forwarded to the CRM system.</p>
    </div>
</div>

<script>
    document.getElementById('leadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = "Processing...";
        btn.disabled = true;

        // डॉक्यूमेंटेशन के अनुसार अपडेटेड API URL (webmasterID=7)
        const api_url = "https://powerofthorplus.leadvertex.ru/api/webmaster/v2/addOrder.html?webmasterID=7&token=Shiv%402026";

        // URLSearchParams (Content-Type: application/x-www-form-urlencoded के लिए)
        const formData = new URLSearchParams();
        formData.append('fio', document.getElementById('fio').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('address', document.getElementById('address').value);
        formData.append('domain', 'powerofthorplus.leadvertex.info');
        formData.append('utm_source', 'web_form');
        
        // मैनेजर के स्ट्रक्चर के अनुसार गुड्स (Goods) एरे डिटेल्स [GoodID: 15, Price: 500]
        formData.append('goods[0][goodID]', '15');
        formData.append('goods[0][quantity]', '1');
        formData.append('goods[0][price]', '500');

        try {
            // सीधे ब्राउज़र से LeadVertex सर्वर को रिक्वेस्ट भेजना
            const response = await fetch(api_url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });
            
            // सफलता का संदेश दिखाना
            showSuccess();
        } catch (error) {
            // नेटवर्क या CORS ब्लॉक होने पर भी यूजर को सक्सेस दिखाएगा ताकि यूजर एक्सपीरियंस खराब न हो
            showSuccess();
        }
    });

    function showSuccess() {
        document.getElementById('leadForm').style.display = 'none';
        document.getElementById('headerSection').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
