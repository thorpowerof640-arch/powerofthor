<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Lead Form</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #222; margin: 0; padding: 20px; }
        .form-box { max-width: 400px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border-top: 4px solid #b8860b; }
        h2 { text-align: center; color: #b8860b; margin-top: 0; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #b8860b; }
        .btn { width: 100%; padding: 14px; background: #b8860b; color: #fff; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #ccc; }
        #success-msg { display: none; text-align: center; padding: 20px; color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-box">
    <div id="form-container">
        <h2>Place Demo Order</h2>
        <form id="demoForm">
            <div class="input-group">
                <label>Full Name (पूरा नाम):</label>
                <input type="text" id="fio" placeholder="Enter full name" required>
            </div>
            <div class="input-group">
                <label>Phone Number (फ़ोन नंबर):</label>
                <input type="tel" id="phone" placeholder="Enter 10 digit number" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Submit Test Lead</button>
        </form>
    </div>
    <div id="success-msg">
        <h3>✅ लीड भेज दी गई है!</h3>
        <p>कृपया अपना CRM डैशबोर्ड या सर्वर लॉग चेक करें।</p>
    </div>
</div>

<script>
    document.getElementById('demoForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = "Sending...";
        btn.disabled = true;

        // सीधे LeadVertex API URL (webmasterID=7)
        const api_url = "https://powerofthorplus.leadvertex.ru/api/webmaster/v2/addOrder.html?webmasterID=7&token=Shiv%402026";

        // URLSearchParams का उपयोग x-www-form-urlencoded फॉर्मेट के लिए
        const formData = new URLSearchParams();
        formData.append('fio', document.getElementById('fio').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('domain', 'powerofthorplus.leadvertex.info');
        formData.append('utm_source', 'web_form');
        
        // मैनेजर के स्ट्रक्चर के अनुसार सामान की डिटेल्स
        formData.append('goods[0][goodID]', '15');
        formData.append('goods[0][quantity]', '1');
        formData.append('goods[0][price]', '500');

        try {
            const response = await fetch(api_url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });
            
            const result = await response.json();
            console.log(result);
            
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        } catch (error) {
            // नोट: कभी-कभी डायरेक्ट ब्राउज़र से भेजने पर CORS एरर आ सकती है, इसलिए रास्ता 1 (PHP होस्टिंग) सबसे बेस्ट है।
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    });
</script>

</body>
</html>
