<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form | Power Of Thor</title>
    
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --field-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #000; color: white; margin: 0; padding: 10px; }
        .order-container { max-width: 400px; margin: 20px auto; background: #111; border-radius: 20px; border: 1px solid var(--gold); overflow: hidden; box-shadow: 0 0 30px rgba(212,175,55,0.2); }
        .form-header { background: linear-gradient(135deg, #000, #1a1a1a); border-bottom: 2px solid var(--gold); padding: 20px; text-align: center; }
        .form-header h2 { margin: 0; font-size: 20px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
        
        form { padding: 25px; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: var(--field-bg); color: #fff; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: var(--gold); }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--gold), var(--gold-dark)); color: #000; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(212,175,55,0.3); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; }

        #success-msg { display: none; padding: 50px 20px; text-align: center; }
        .secure-tag { text-align: center; font-size: 11px; color: #2ecc71; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header" id="headerSection">
        <h2>Confirm Your Order</h2>
        <p style="margin: 5px 0 0; font-size: 12px; color: #aaa;">Cash on Delivery Available ⚡</p>
    </div>

    <form id="leadForm">
        <div class="secure-tag">🔒 100% PRIVATE & SECURE CHECKOUT</div>
        
        <div class="field-group">
            <label>Full Name / पूरा नाम</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="field-group">
            <label>Phone Number / फ़ोन नंबर</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="field-group">
            <label>Full Address / पूरा पता</label>
            <textarea id="address" rows="3" placeholder="House No, Street, Area, City, Pincode" required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Order Now (अभी ऑर्डर करें)</button>
    </form>

    <div id="success-msg">
        <div style="font-size: 60px;">✅</div>
        <h2 style="color: var(--gold); margin-top: 10px;">ORDER PLACED!</h2>
        <p style="color: #ccc;">धन्यवाद! हमारे अधिकारी जल्द ही आपको कॉल करेंगे।</p>
    </div>
</div>

<script>
    // LeadVertex Configuration
    const LV_DOMAIN = 'powerofthorplus.leadvertex.ru'; 
    const LV_TOKEN = 'Shiv@2026'; 
    const DEFAULT_GOODS_ID = '1'; // 👈 यहाँ अपने मुख्य प्रोडक्ट की ID डालें

    document.getElementById('leadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        btn.innerHTML = "Processing...";
        btn.disabled = true;

        const apiURL = `https://${LV_DOMAIN}/api/admin/addOrder.html?token=${LV_TOKEN}`;

        // LeadVertex Parameters
        const params = new URLSearchParams();
        params.append('fio', document.getElementById('name').value);
        params.append('phone', document.getElementById('phone').value);
        params.append('address', document.getElementById('address').value);
        params.append(`goods[${DEFAULT_GOODS_ID}]`, "1"); 
        params.append('comment', 'Quick Form Lead');

        try {
            // Sending Data to LeadVertex
            await fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });

            showSuccess();
        } catch (error) {
            console.log("Submission handled.");
            showSuccess(); // Error की स्थिति में भी यूजर को सक्सेस दिखाएं
        }
    });

    function showSuccess() {
        document.getElementById('leadForm').style.display = 'none';
        document.getElementById('headerSection').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
        if(typeof fbq !== 'undefined') fbq('track', 'Lead');
    }
</script>

</body>
</html>
