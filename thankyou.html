<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>धन्यवाद! - Order Confirmed</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-color: #f5f5f5;
            --white: #ffffff;
            --text-dark: #222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .thankyou-card {
            background: var(--white);
            max-width: 500px;
            width: 100%;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 10px;
        }

        p {
            font-size: 17px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f9f9f9;
            border: 1px dashed #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-box h4 {
            color: #333;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            font-size: 15px;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            width: 100%;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.02);
        }

        .home-link {
            display: inline-block;
            margin-top: 15px;
            color: #777;
            text-decoration: underline;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="thankyou-card">
        <!-- Success Icon -->
        <div class="icon-circle">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <!-- Heading -->
        <h1>धन्यवाद! (Thank You)</h1>
        <p>आपका ऑर्डर सफलतापूर्वक दर्ज कर लिया गया है।</p>

        <!-- Order Information Box -->
        <div class="info-box">
            <h4><i class="fa-solid fa-truck-fast"></i> आगे क्या होगा?</h4>
            <ul>
                <li><i class="fa-solid fa-check" style="color: green;"></i> हमारी टीम जल्द ही आपसे कॉल करके ऑर्डर कन्फर्म करेगी।</li>
                <li><i class="fa-solid fa-check" style="color: green;"></i> डिलीवरी 3 से 5 दिनों में हो जाएगी।</li>
                <li><i class="fa-solid fa-check" style="color: green;"></i> भुगतान कैश ऑन डिलीवरी (COD) रहेगा।</li>
            </ul>
        </div>

        <!-- WhatsApp Support Button -->
        <a href="https://wa.me/918750338234" target="_blank" class="whatsapp-btn">
            <i class="fa-brands fa-whatsapp" style="font-size: 22px;"></i> WhatsApp पर मदद लें
        </a>

        <!-- Back to Website -->
        <a href="index.html" class="home-link">मुख्य पृष्ठ पर वापस जाएं</a>
    </div>

</body>
</html>
